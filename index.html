<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layerpath in Slack and ChatGPT · Onboarding (V1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap">
<style>
/* ===================== Demo chrome ===================== */
:root{--ink:#1b1f24;--muted:#5d6670;--line:#dde1e6;--bg:#eceef1;--later:#b45309;--pulse:26,115,232}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
.topbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#14181c;color:#fff}
.topbar .t{font-weight:700;font-size:15px}
.topbar .note{font-size:12px;color:#a9b3bd}
.topbar .sp{flex:1}
.chip-later{font-size:12px;font-weight:700;color:#5a2c00;background:#ffd38a;border-radius:999px;padding:3px 10px}
.app{display:flex;height:calc(100vh - 46px)}
.rail{width:244px;flex:none;overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:6px 8px 24px}
.rail h4{margin:14px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rail h4.lt{color:var(--later)}
.ri{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.3;color:#2a3138;text-decoration:none}
.ri:hover{background:#f2f4f6}
.ri.on{background:#e3f1ee;color:#0b4f49;font-weight:600}
.ri .c{font:600 11px/1.35 ui-monospace,Menlo,monospace;color:#7b8590;min-width:30px}
.ri.on .c{color:#0b4f49}
.ri .n{margin-left:auto;font-size:11px;color:#9aa3ac;font-weight:400}
.ri.lt .c{color:var(--later)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 16px 8px}
.schead{display:flex;align-items:center;gap:10px;min-height:34px;flex:none}
.schead .st{font-weight:700;font-size:15px;white-space:nowrap}
.schead .code{font:700 12px ui-monospace,Menlo,monospace;background:#1b1f24;color:#fff;border-radius:5px;padding:2px 6px}
.schead .code.lt{background:var(--later)}
.tools{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;color:#38414a}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:#1b1f24;color:#fff}
.persona{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#38414a;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .pav{width:24px;height:24px;border-radius:6px;color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.persona b{font-weight:700}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.under{flex:none;padding-top:6px}
.row1{display:flex;align-items:center;gap:14px}
.caption{flex:1;min-width:0;font-size:15px;line-height:1.4;font-weight:500;color:#1b1f24}
.caption .lt{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--later);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.ctrls{display:flex;align-items:center;gap:8px;flex:none}
.ctrls button{height:32px;border-radius:8px;border:1px solid #c9ced4;background:#fff;padding:0 14px;font-size:13px;font-weight:600;color:#1b1f24}
.ctrls button:disabled{opacity:.4;cursor:default}
.ctrls button.primary{background:#1b1f24;color:#fff;border-color:#1b1f24}
.ctrls #counter{font-size:12.5px;color:var(--muted);min-width:76px;text-align:center}
#how{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:13px}
#how summary{cursor:pointer;padding:6px 12px;color:#38414a;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
#how summary::-webkit-details-marker{display:none}
#how summary:before{content:"\25B8";font-size:11px;color:#8b949e}
#how[open] summary:before{content:"\25BE"}
#howBody{padding:0 14px 10px 30px;color:#2a3138;line-height:1.5;max-height:110px;overflow:auto}
.copyflag{display:inline-block;font-size:11.5px;font-weight:700;color:#7a3e00;background:#ffe7bf;border-radius:5px;padding:1px 7px}
#howBody .copyflag{margin-top:6px}
:focus-visible{outline:2px solid rgb(var(--pulse));outline-offset:2px}

/* ===================== Desktop ===================== */
.desk{position:absolute;left:50%;top:50%;width:1180px;height:720px;transform:translate(-50%,-50%) scale(var(--s,1));border-radius:14px;overflow:hidden;background:linear-gradient(140deg,#a9b8c8 0%,#c8d3dd 48%,#e1e7ec 100%);box-shadow:0 8px 30px rgba(20,30,40,.14)}
.desk.later{box-shadow:0 0 0 4px var(--later),0 8px 30px rgba(20,30,40,.14)}
.win{position:absolute;width:1060px;height:632px;border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.3);background:#fff}
#winSlack{left:14px;top:12px}
#winChrome{left:104px;top:44px}
.win.front{z-index:3}
.win.back{z-index:2;cursor:pointer}
.win.back>*{pointer-events:none}
.win.back:after{content:"";position:absolute;inset:0;background:rgba(40,50,60,.12)}
.win.raise{animation:raise .4s cubic-bezier(.2,.8,.2,1)}
@keyframes raise{0%{transform:scale(.965) translateY(10px);opacity:.55}100%{transform:none;opacity:1}}
.dock{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:5;display:flex;gap:10px;padding:5px 10px 7px;border-radius:14px;background:rgba(255,255,255,.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.6)}
.dk{position:relative;width:36px;height:36px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.dk i{position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#333}
.dk .slk{width:36px;height:36px;border-radius:9px;background:#4a154b;display:grid;place-items:center}
.dk .slk svg{width:22px;height:22px}
.dk .chr{width:32px;height:32px;border-radius:50%;background:conic-gradient(from -30deg,#db4437 0 120deg,#f4c20d 0 240deg,#0f9d58 0);display:grid;place-items:center}
.dk .chr:after{content:"";width:13px;height:13px;border-radius:50%;background:#4285f4;box-shadow:0 0 0 3px #fff}
.swap{position:absolute;left:50%;bottom:64px;transform:translate(-50%,0);z-index:40;background:rgba(20,24,28,.92);color:#fff;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.swap.show{animation:swap 1.7s ease forwards}
@keyframes swap{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
.swap .pav{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px}
.later-banner{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:30;background:var(--later);color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em;padding:7px 22px 8px;border-radius:0 0 12px 12px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:none}
.desk.later .later-banner{display:block}
.newtab-tip{position:absolute;z-index:6;background:rgb(var(--pulse));color:#fff;font:600 11.5px system-ui,sans-serif;border-radius:6px;padding:3px 8px;white-space:nowrap;pointer-events:none;animation:tip 2.6s ease forwards}
.newtab-tip:after{content:"";position:absolute;left:14px;top:-4px;border:4px solid transparent;border-top:0;border-bottom-color:rgb(var(--pulse))}
@keyframes tip{0%{opacity:0;transform:translateY(4px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* the element to press next */
.nx{position:relative;z-index:1;outline:2px solid rgba(var(--pulse),.95)!important;outline-offset:2px;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--pulse),.55)}70%{box-shadow:0 0 0 10px rgba(var(--pulse),0)}100%{box-shadow:0 0 0 0 rgba(var(--pulse),0)}}
.ctrls button.nx{outline-offset:2px}
.hint{animation:hint .5s ease 2}
@keyframes hint{50%{box-shadow:0 0 0 6px rgba(var(--pulse),.5)}}

/* ===================== Slack ===================== */
.sl{position:relative;height:100%;display:flex;flex-direction:column;background:#fff;color:#1d1c1d;font:15px/1.46 Lato,"Helvetica Neue",Helvetica,Arial,sans-serif}
.sl .ic{width:16px;height:16px;flex:none}
.traffic{display:flex;gap:7px;flex:none}
.traffic i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.traffic i:nth-child(2){background:#febc2e}
.traffic i:nth-child(3){background:#28c840}
.sl-top{height:36px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;background:#350d36;color:rgba(255,255,255,.8)}
.sl-top .nav{display:flex;gap:10px;align-items:center}
.sl-search{flex:1;max-width:520px;margin:0 auto;height:24px;border-radius:6px;background:rgba(255,255,255,.2);display:flex;align-items:center;gap:7px;padding:0 10px;font-size:13px;color:rgba(255,255,255,.85)}
.sl-search .ic{width:13px;height:13px}
.sl-body{flex:1;min-height:0;display:flex}
.sl-rail{width:62px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 12px;background:#350d36}
.sl-wsic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.sl-ri{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:rgba(255,255,255,.85)}
.sl-ri .bx{width:34px;height:30px;border-radius:8px;display:grid;place-items:center}
.sl-ri .bx .ic{width:18px;height:18px}
.sl-ri.on .bx{background:rgba(255,255,255,.22)}
.sl-rail .sp{flex:1}
.sl-me{position:relative}
.sl-me i{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:#2bac76;border:2px solid #350d36}
.av{display:inline-grid;place-items:center;color:#fff;font-weight:700;border-radius:6px;flex:none;overflow:hidden;line-height:1}
.av.lpav svg,.av.sbav svg{width:100%;height:100%;display:block}
.av.sbav{background:#fff}
.sl-side{width:208px;flex:none;display:flex;flex-direction:column;background:#4a154b;color:rgba(255,255,255,.75);font-size:15px}
.sd-head{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid rgba(255,255,255,.13);color:#fff}
.sd-ws{font-weight:900;font-size:18px;display:flex;align-items:center;gap:5px}
.sd-ws .ic{width:13px;height:13px}
.sd-cmp{width:30px;height:30px;border-radius:8px;background:#fff;color:#4a154b;display:grid;place-items:center}
.sd-scroll{flex:1;overflow:hidden;padding:8px 0}
.sd-i{display:flex;align-items:center;gap:8px;height:28px;margin:0 8px;padding:0 10px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden}
.sd-i .ic{opacity:.85}
.sd-i .av{border-radius:4px;font-size:9px}
.sd-i .lbl{overflow:hidden;text-overflow:ellipsis}
.sd-i:hover{background:rgba(255,255,255,.08)}
.sd-i.on{background:#1164a3;color:#fff}
.sd-i.un{color:#fff;font-weight:900}
.sd-i .badge{margin-left:auto;background:#cd2553;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 6px;line-height:17px}
.sd-i .you{font-weight:400;opacity:.65;font-size:13px}
.sd-i .gst{font-weight:400;opacity:.65;font-size:12px}
.sd-sec{display:flex;align-items:center;gap:6px;height:26px;margin:10px 8px 0;padding:0 10px;font-size:14.5px}
.sd-sec .ic{width:11px;height:11px}
.sl-main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.ch-head{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 0 18px;border-bottom:1px solid #e2e2e2}
.ch-title{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;white-space:nowrap;min-width:0}
.ch-title .chev{width:12px;height:12px;opacity:.7}
.ch-title .av{border-radius:5px}
.ch-r{display:flex;align-items:center;gap:8px}
.orgs{display:flex}
.orgs i{width:20px;height:20px;border-radius:5px;color:#fff;font:900 10px Lato,sans-serif;display:grid;place-items:center;font-style:normal;border:2px solid #fff;margin-left:-5px}
.orgs i:first-child{margin-left:0}
.ch-mem{display:flex;align-items:center;gap:6px;border:1px solid #ddd;border-radius:7px;padding:2px 8px 2px 3px;font-size:13px;color:#616061}
.ch-mem .stack{display:flex}
.ch-mem .stack .av{border:2px solid #fff;margin-left:-6px;border-radius:5px;font-size:8px}
.ch-mem .stack .av:first-child{margin-left:0}
.ch-tabs{height:36px;flex:none;display:flex;align-items:flex-end;gap:18px;padding:0 18px;border-bottom:1px solid #e2e2e2;font-size:13.5px;color:#616061}
.ch-tabs span{padding-bottom:8px;display:flex;align-items:center;gap:5px;position:relative}
.ch-tabs .ic{width:14px;height:14px}
.ch-tabs span.on{color:#1d1c1d;font-weight:700;box-shadow:inset 0 -2px #1d1c1d}
.ch-tabs span[data-k]{cursor:pointer}
.ch-tabs .tdot{width:7px;height:7px;border-radius:50%;background:#cd2553;display:inline-block}
.atabs span{font-size:14.5px;padding-left:2px;padding-right:2px}
.ch-tabs span.nx{border-radius:5px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:4px 0 10px}
.day{display:flex;align-items:center;margin:10px 0 4px;position:relative}
.day:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#e2e2e2}
.day span{position:relative;margin:0 auto;border:1px solid #e2e2e2;border-radius:12px;background:#fff;font-size:12.5px;font-weight:700;padding:1px 12px}
.msg{padding:6px 18px}
.msg.cont{padding-top:1px}
.m-row{display:flex;gap:8px}
.m-gut{width:36px;flex:none}
.m-body{flex:1;min-width:0}
.m-head{display:flex;align-items:baseline;gap:6px;line-height:1.3;margin-bottom:1px;flex-wrap:wrap}
.m-name{font-weight:900;font-size:15px}
.appb{font-size:10px;font-weight:700;color:#616061;background:rgba(29,28,29,.13);border-radius:3px;padding:1px 3px;letter-spacing:.2px;align-self:center}
.extorg{width:15px;height:15px;border-radius:4px;color:#fff;font:900 8.5px/15px Lato,sans-serif;text-align:center;align-self:center}
.m-time{font-size:12px;color:#616061}
.m-text{overflow-wrap:anywhere}
.eph{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#616061;margin:0 0 3px 44px}
.eph .ic{width:15px;height:15px}
.mention{background:rgba(29,155,209,.1);color:#1264a3;border-radius:3px;padding:0 2px}
.mention.me{background:rgba(242,199,68,.4);color:#1d1c1d}
.chlink{color:#1264a3;background:rgba(29,155,209,.1);border-radius:3px;padding:0 2px}
.lnk{color:#1264a3;text-decoration:none}
.sl code{color:#c01343;background:rgba(29,28,29,.04);border:1px solid rgba(29,28,29,.13);border-radius:3px;padding:0 3px;font-size:12px}
.m-replies{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;cursor:pointer}
.m-replies .av{border-radius:4px;font-size:9px}
.m-replies .rc{color:#1264a3;font-weight:700}
.m-replies .rl{color:#616061}
.files{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.shot{width:100px;height:64px;border-radius:6px;border:1px solid #ddd;background:#f6f7f9;position:relative;overflow:hidden;flex:none}
.shot b{position:absolute;left:0;right:0;top:0;height:10px;background:#e3e8ee}
.shot b:after{content:"";position:absolute;left:5px;top:3px;width:18px;height:4px;border-radius:2px;background:#b9c3ce}
.shot i{position:absolute;left:8px;top:18px;width:46%;height:6px;border-radius:3px;background:#cfd6df}
.shot i+i{top:30px;width:64%}
.shot i+i+i{top:44px;width:30%;height:9px;background:#6cc2ad}
.shot u{position:absolute;right:8px;top:18px;width:24px;height:34px;border-radius:3px;background:#e8edf2}
.shot.s2 i+i+i{left:40%;background:#7aa7e0}
.shot.s3 u{background:#f3e0c7}
/* thread */
.th{width:408px;flex:none;border-left:1px solid #e2e2e2;display:flex;flex-direction:column;background:#fff}
.th-head{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;border-bottom:1px solid #e2e2e2}
.th-head b{font-weight:900;font-size:17px;margin-right:8px}
.th-head .thc{font-size:13px;color:#616061}
.th-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 0 8px}
.th .msg{padding-left:16px;padding-right:14px}
.th-div{display:flex;align-items:center;gap:10px;margin:2px 16px 4px;font-size:13px;color:#616061}
.th-div:after{content:"";flex:1;height:1px;background:#e2e2e2}
.th-status{display:flex;align-items:center;gap:8px;margin:6px 16px 2px;font-size:13.5px;color:#616061}
.th-status .av{border-radius:4px}
.th .cmp{padding:0 14px 12px}
.th .cmp-tools{display:none}
/* composer */
.cmp{flex:none;padding:0 18px 14px}
.cmp-box{border:1px solid #c8c8c8;border-radius:8px;overflow:hidden}
.cmp-box.has{border-color:#8d8d8d;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.cmp-tools{height:30px;display:flex;align-items:center;gap:13px;padding:0 10px;background:#f8f8f8;color:#9a9a9a}
.cmp-tools .ic{width:14px;height:14px}
.cmp-text{min-height:22px;padding:7px 12px 3px;font-size:15px}
.cmp-text .ph{color:#8b8b8b}
.cmp-files{padding:4px 12px 2px}
.cmp-files .shot{width:64px;height:44px}
.cmp-files .shot i{top:15px}.cmp-files .shot i+i{top:23px}.cmp-files .shot i+i+i{top:31px;height:6px}
.cmp-files .shot u{top:15px;width:14px;height:22px}
.cmp-bar{height:34px;display:flex;align-items:center;gap:12px;padding:0 6px 0 10px;color:#7a7a7a}
.cmp-bar .ic{width:16px;height:16px}
.cmp-send{margin-left:auto;width:34px;height:26px;border-radius:5px;border:0;background:transparent;color:#b5b5b5;display:grid;place-items:center}
.cmp-send.on{background:#007a5a;color:#fff}
/* block kit */
.blocks{margin-top:1px}
.bk-sec{display:flex;gap:12px;align-items:flex-start;margin:3px 0}
.bk-text{flex:1;min-width:0;overflow-wrap:anywhere}
.bk-acc{flex:none}
.bk-ctx{font-size:12.5px;color:#616061;margin:4px 0;line-height:1.4}
.bk-act{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bk-btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid rgba(29,28,29,.3);background:#fff;color:#1d1c1d;font:700 14px/1 Lato,"Helvetica Neue",sans-serif;white-space:nowrap}
.bk-btn.primary{background:#007a5a;border-color:#007a5a;color:#fff}
.bk-btn.danger{background:#e01e5a;border-color:#e01e5a;color:#fff}
.bk-select{height:30px;padding:0 8px 0 12px;border-radius:6px;border:1px solid rgba(29,28,29,.3);display:inline-flex;align-items:center;gap:14px;color:#616061;font-size:14px;cursor:pointer;background:#fff}
.bk-select .ic{width:12px;height:12px}
.bk-div{height:1px;background:#e2e2e2;margin:12px 0}
.bk-hdr{font-weight:900;font-size:17px;margin:6px 0}
.bk-quote{border-left:4px solid #ddd;padding-left:10px;margin:4px 0;color:#1d1c1d}
.bk-plan{margin:6px 0}
.plan-head{display:flex;align-items:center;gap:10px;color:#616061;cursor:pointer}
.plan-head .chev{width:12px;height:12px}
.plan-list{margin:6px 0 2px 6px;border-left:1px solid #d6d6d6;padding:0 0 0 0}

.wd-what li i{width:28px;height:28px;border-radius:9px;background:#1f2326;border:1px solid #30353a;display:grid;place-items:center;flex:none;color:#41e1c4;font-style:normal}
.wd-what li i .ic{width:15px;height:15px}
.wd-what li b{display:block;color:#fff;font-weight:600}
.wd-what li span{color:#9ba7b3;font-size:12.5px}
.wd-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wd-chip{display:inline-flex;gap:6px;align-items:center;height:30px;padding:0 12px;border-radius:15px;border:1px solid #30353a;background:#16181a;color:#d2d6da}
.wd-chip:before{content:"\2726";color:#e9783e;font-size:11px}
.wd-car{display:flex;gap:10px;padding:12px;overflow:hidden}
.wd-tile{width:178px;flex:none;border:1px solid #2a2e33;border-radius:12px;overflow:hidden;background:#16181a}
.wd-tile .cv{position:relative;aspect-ratio:16/9;overflow:hidden}
.wd-tile .cv .chip{position:absolute;right:6px;top:6px;background:rgba(20,22,24,.82);color:#fff;border-radius:10px;padding:2px 7px;font-size:10.5px;z-index:2}
.wd-tile .tb{padding:7px 10px 10px}
.wd-tile b{display:block;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd-tile small{display:block;color:#8f9aa5;margin-bottom:6px}
.wd-tile .wd-btn{height:28px;font-size:12.5px}
/* Layerpath consent page for ChatGPT (to build) */
.cs-pair{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.cs-pair .ai{width:46px;height:46px;border-radius:12px;overflow:hidden}
.cs-pair .ai svg{width:46px;height:46px;display:block}
.cs-pair .dots{display:flex;gap:4px}
.cs-pair .dots i{width:5px;height:5px;border-radius:50%;background:#5b656f}
.cs-who{display:flex;align-items:center;gap:10px;background:#1c1f22;border:1px solid #2a2e33;border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:13.5px;color:#d2d6da}
.cs-who .sp{flex:1}
.cs-who a{color:#9ba7b3;text-decoration:underline;cursor:pointer}
.cs-lbl{font-size:13px;color:#9ba7b3;margin:4px 0 6px}
.cs-can{background:#16181a;border:1px solid #2a2e33;border-radius:12px;padding:10px 14px;margin:12px 0 16px;color:#d2d6da;font-size:13.5px}
.cs-can ul{margin:4px 0 0;padding-left:18px}
.cs-btns{display:flex;gap:10px}
.cs-btns .sub-btn{flex:1}
.cs-btns .ghost-btn{flex:none}
.lpa-small{color:#8f9aa5;font-size:12.5px;text-align:center;margin-top:12px}
.int-rows{margin-top:10px;border-top:1px solid #2a2e33}
.int-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2a2e33;font-size:13px;color:#d2d6da}
.int-row .who2{flex:1;min-width:0}
.int-row small{color:#8f9aa5}
.int-link{color:#72e9d3;text-decoration:underline;font-size:13px}

      var st = SST[s.code] || s.st;
      h += '<a class="ri' + (s.group === "later" ? " lt" : "") + (CUR.sc === s ? " on" : "") + '" href="#' + s.code + '" data-sc="' + s.code + '"' + (CUR.sc === s ? ' aria-current="page"' : "") + '><span class="c">' + s.code + "</span><span>" + esc(s.title) + '</span><span class="sd ' + st + '" title="' + esc(SST_LABEL[st] || "") + '" aria-label="' + esc(SST_LABEL[st] || "") + '"></span><span class="n">' + (s.group === "start" ? "" : (COUNTS[s.code] || "")) + "</span></a>";
    });
  });
  $("#rail").innerHTML = h;
}
function renderHead() {
  var s = CUR.sc;
  $("#scCode").textContent = s.code;
  $("#scCode").className = "code" + (s.group === "later" ? " lt" : "");
  $("#scTitle").textContent = s.title;
  var sst = SST[s.code] || s.st;
  $("#scBadge").innerHTML = s.group === "start" || s.group === "later" ? "" : BADGE[sst === "mix" ? "mix" : sst] || "";
  var tools = "";
  if (s.code === "P5") {
    var cur = (CUR.opts.P5 && CUR.opts.P5.plan) || "free";
    tools = '<span>Acme\'s plan here:</span><span class="seg">' + [["free", "Free"], ["pro", "Pro, 3 of 3 used"], ["team", "Team, 14 of 14 used"]].map(function (x) { return '<button type="button" class="' + (cur === x[0] ? "on" : "") + '" data-ui="p5:' + x[0] + '">' + x[1] + "</button>"; }).join("") + "</span>";
  }
  $("#scTools").innerHTML = tools;
}

/* clicks */
document.addEventListener("click", function (e) {
  var ri = e.target.closest(".ri");
  if (ri) { e.preventDefault(); openScenario(ri.getAttribute("data-sc")); return; }
  var ui = e.target.closest("[data-ui]");
  if (ui && (desk.contains(ui) || $("#scTools").contains(ui))) {
    var u = ui.getAttribute("data-ui");
    if (u.indexOf("oa:") === 0) { var id = u.slice(3); UI.oaOpen[id] = !UI.oaOpen[id]; redrawCurrent(); return; }
    if (u === "plan") { UI.planClosed = !UI.planClosed; redrawCurrent(); return; }
    if (u.indexOf("p5:") === 0) { CUR.opts.P5 = { plan: u.slice(3) }; var keep = CUR.i; CUR.steps = buildSteps(CUR.sc); LAST = {}; renderHead(); show(keep, 0); return; }
  }
  var w = e.target.closest(".win");
  if (w && w.classList.contains("back")) { setFront(w === winSlack ? "slack" : "chrome", true); return; }
  var t = e.target.closest("[data-k]");
  if (!t || !desk.contains(t)) return;
  var k = t.getAttribute("data-k");
  if (k === NEXT) { e.preventDefault(); next(); return; }
  if (k.indexOf("dock:") === 0) { setFront(k.slice(5), true); return; }
  var target = desk.querySelector(".nx") || $("#btnNext");
  target.classList.remove("hint"); void target.offsetWidth; target.classList.add("hint");
});
function redrawCurrent() {
  var step = CUR.steps[CUR.i];
  var keepFront = UI.front;
  var st = step.states[step.states.length - 1];
  if (animating) return;
  draw(st, step, { anim: false });
  if (keepFront && keepFront !== st.front) setFront(keepFront, false);
  markNext(true);
}
$("#btnNext").addEventListener("click", next);
$("#btnBack").addEventListener("click", back);
$("#btnRestart").addEventListener("click", function () { openScenario(CUR.sc.code); });
document.addEventListener("keydown", function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("[data-k]") && desk.contains(e.target) && !/^(BUTTON|A)$/.test(e.target.tagName)) { e.preventDefault(); e.target.click(); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
});
window.addEventListener("hashchange", function () {
  var code = location.hash.slice(1).toUpperCase();
  if (CUR.sc && code === CUR.sc.code) return;
  if (SCEN.some(function (s) { return s.code === code; })) openScenario(code);
});
if (window.ResizeObserver) new ResizeObserver(fitDesk).observe($("#stage"));
window.addEventListener("resize", fitDesk);

/* self-test for checking every step: window.__demo.selfTest() */
function selfTest() {
  var problems = [], total = 0;
  var saveSc = CUR.sc ? CUR.sc.code : "A1", saveI = CUR.i, saveOpts = clone(CUR.opts);
  SCEN.forEach(function (s) {
    var variants = s.code === "P5" ? ["free", "pro", "team"] : [null];
    variants.forEach(function (v) {
      if (v) CUR.opts.P5 = { plan: v };
      var steps;
      try { steps = buildSteps(s); } catch (err) { problems.push(s.code + ": build failed: " + err.message); return; }
      CUR.sc = s; CUR.steps = steps;
      steps.forEach(function (step, i) {
        total++;
        try {
          NEXT = step.next || null;
          if (step.panel) {
            if (/\u2014/.test(step.panel)) problems.push(s.code + ": em dash in panel");
            if (/\u2019/.test(step.panel)) problems.push(s.code + ": curly apostrophe in panel");
            return;
          }
          step.states.forEach(function (st) { LAST = {}; draw(st, step, { anim: false }); });
          if (!step.cap) problems.push(s.code + " step " + (i + 1) + ": no caption");
          if (/\u2014/.test(step.cap)) problems.push(s.code + " step " + (i + 1) + ": em dash in caption");
          if (step.next) {
            var el = desk.querySelector('[data-k="' + step.next + '"]');
            if (!el) problems.push(s.code + (v ? "/" + v : "") + " step " + (i + 1) + ": target '" + step.next + "' not found");
            else {
              var win = el.closest(".win");
              if (win && !win.classList.contains("front")) problems.push(s.code + " step " + (i + 1) + ": target '" + step.next + "' is in the back window");
              if (!el.classList.contains("nx")) problems.push(s.code + " step " + (i + 1) + ": target not pulsing");
            }
          }
          var txt = desk.textContent;
          if (/\u2014/.test(txt)) problems.push(s.code + " step " + (i + 1) + ": em dash on screen");
          if (/\u2019/.test(txt)) problems.push(s.code + " step " + (i + 1) + ": curly apostrophe on screen");
        } catch (err) { problems.push(s.code + " step " + (i + 1) + ": render error: " + err.message); }
      });
    });
  });
  CUR.opts = saveOpts;
  openScenario(saveSc, saveI);
  return { scenarios: SCEN.length, steps: total, problems: problems };
}
window.__demo = {
  selfTest: selfTest,
  list: function () { return SCEN.map(function (s) { return s.code + " " + s.title + " (" + COUNTS[s.code] + ")"; }); },
  open: openScenario, next: next, back: back,
  state: function () { return { sc: CUR.sc.code, i: CUR.i, n: CUR.steps.length, next: NEXT }; }
};

/* boot */
SCEN.forEach(function (s) {
  var steps = buildSteps(s), seen = {};
  COUNTS[s.code] = steps.length;
  steps.forEach(function (st) { seen[st.later ? "later" : (st.st || s.st)] = 1; });
  var keys = Object.keys(seen);
  SST[s.code] = keys.length === 1 ? keys[0] : (seen.live && seen.build ? "mix" : keys[0]);
});
fitDesk();
var startCode = location.hash.slice(1).toUpperCase();
openScenario(SCEN.some(function (s) { return s.code === startCode; }) ? startCode : "G1");
})();
</script>
</body>
